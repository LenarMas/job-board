<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Capture job</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
      padding: 12px;
    }
    h1 { font-size: 15px; margin-bottom: 2px; }
    #source {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 10px;
    }
    label { display: block; margin-bottom: 8px; color: #475569; }
    input, select, textarea {
      width: 100%;
      margin-top: 2px;
      padding: 5px 7px;
      font: inherit;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row label { flex: 1; }
    button {
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #4f46e5;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { margin-top: 8px; min-height: 18px; }
    #status.ok { color: #15803d; }
    #status.error { color: #b91c1c; white-space: pre-line; }
    #status a { color: #4f46e5; font-weight: 600; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Capture job</h1>
  <div id="source">Reading page…</div>
  <form id="form">
    <label>Job title
      <input id="title" required />
    </label>
    <label>Company
      <input id="company" />
    </label>
    <div class="row">
      <label>Location
        <input id="location" />
      </label>
      <label>Salary
        <input id="salary" />
      </label>
    </div>
    <label>Post URL
      <input id="url" />
    </label>
    <label>Stage
      <select id="stage">
        <option value="wishlist" selected>Wishlist</option>
        <option value="applied">Applied</option>
        <option value="interview">Interview</option>
        <option value="offer">Offer</option>
        <option value="rejected">Rejected</option>
      </select>
    </label>
    <label>Description
      <textarea id="description"></textarea>
    </label>
    <button id="save" type="submit">Save to board</button>
  </form>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
